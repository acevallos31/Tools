services:
  routeros:
    image: evilfreelancer/docker-routeros:latest
    privileged: true
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "22"
    networks:
      - default
      - routeros_net

networks:
  routeros_net:
    driver: bridge
