name: MikroTik RouterOS sandbox

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Skills/MikroTik-MCP/mikrotik_skill/**"
      - "Skills/MikroTik-MCP/tests/integration/**"
      - "Skills/MikroTik-MCP/requirements*.txt"
      - ".github/workflows/mikrotik-mcp-integration.yml"

permissions:
  contents: read

jobs:
  routeros-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Skills/MikroTik-MCP

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Skills/MikroTik-MCP/requirements.txt
            Skills/MikroTik-MCP/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: RouterOS sandbox integration
        run: python -m pytest -q -m integration
