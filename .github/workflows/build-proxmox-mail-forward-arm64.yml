name: Build Proxmox Mail Forward ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - feat/pbs-smart-mail-forward-arm64
    paths:
      - .github/workflows/build-proxmox-mail-forward-arm64.yml

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsystemd-dev uuid-dev clang ca-certificates git file

      - name: Verify native linker libraries
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = arm64
          pkg-config --modversion openssl
          pkg-config --modversion uuid
          test -e /usr/lib/aarch64-linux-gnu/libuuid.so
          test -e /usr/lib/aarch64-linux-gnu/libssl.so

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout pinned official Proxmox sources
        env:
          MAIL_FORWARD_SHA: 9890c29a3d3da04262fe5564b2321be59928de5e
          PROXMOX_RS_SHA: 89c1d597a9d15743049eadcb1add380573265904
        run: |
          set -euo pipefail
          git init -q upstream
          git -C upstream remote add origin https://github.com/proxmox/proxmox-mail-forward.git
          git -C upstream fetch --depth 1 origin "$MAIL_FORWARD_SHA"
          git -C upstream checkout -q --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$MAIL_FORWARD_SHA"
          git -C upstream rev-parse HEAD | tee upstream-commit.txt
          git init -q proxmox-rs
          git -C proxmox-rs remote add origin https://github.com/proxmox/proxmox-rs.git
          git -C proxmox-rs fetch --depth 1 origin "$PROXMOX_RS_SHA"
          git -C proxmox-rs checkout -q --detach FETCH_HEAD
          test "$(git -C proxmox-rs rev-parse HEAD)" = "$PROXMOX_RS_SHA"
          git -C proxmox-rs rev-parse HEAD | tee proxmox-rs-commit.txt
          cat upstream/Cargo.toml

      - name: Restore crates.io registry for upstream build
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo"
          if [ -f "$HOME/.cargo/config.toml" ]; then
            echo 'Existing Cargo config:'
            cat "$HOME/.cargo/config.toml"
            mv "$HOME/.cargo/config.toml" "$HOME/.cargo/config.toml.runner-backup"
          fi
          if [ -f "$HOME/.cargo/config" ]; then
            mv "$HOME/.cargo/config" "$HOME/.cargo/config.runner-backup"
          fi
          if [ -f /usr/share/cargo/config.toml ]; then
            echo 'System Cargo configuration is present'
          fi
          printf '[source.crates-io]\nregistry = "sparse+https://index.crates.io/"\n' > "$HOME/.cargo/config.toml"
          cargo --version

      - name: Disable Debian vendored registry in upstream clone
        run: |
          set -euo pipefail
          echo 'Upstream Cargo config:'
          cat upstream/.cargo/config.toml
          cp upstream/.cargo/config.toml upstream-cargo-config-original.toml
          rm upstream/.cargo/config.toml
          echo 'Use crates.io to resolve dependencies on hosted ARM64 runner'

      - name: Patch all internal Proxmox Rust libraries from official workspace
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tomllib

          root = pathlib.Path("proxmox-rs")
          manifest = tomllib.loads((root / "Cargo.toml").read_text())
          members = manifest["workspace"]["members"]
          patches = []
          for member in members:
              pkg = tomllib.loads((root / member / "Cargo.toml").read_text())["package"]["name"]
              if pkg.startswith(("proxmox-", "pbs-", "pve-")):
                  patches.append((pkg, member))
          assert patches, "No Proxmox workspace crates found"
          names = [name for name, _ in patches]
          assert len(names) == len(set(names)), "Duplicate crate names"
          with open("upstream/Cargo.toml", "a", encoding="utf-8") as out:
              out.write("\n[patch.crates-io]\n")
              for name, member in sorted(patches):
                  out.write(f'{name} = {{ path = "../proxmox-rs/{member}" }}\n')
          print(f"Added {len(patches)} official workspace crate patches")
          PY
          tail -n 12 upstream/Cargo.toml

      - name: Resolve dependencies and compile ARM64 release
        working-directory: upstream
        run: |
          cargo generate-lockfile
          cargo build --release --locked

      - name: Validate and package
        run: |
          set -euo pipefail
          BIN=upstream/target/release/proxmox-mail-forward
          test -x "$BIN"
          file "$BIN"
          file "$BIN" | grep -q 'aarch64'
          ldd "$BIN" | tee dynamic-dependencies.txt
          if grep -q 'not found' dynamic-dependencies.txt; then
            echo 'Missing runtime shared libraries' >&2
            exit 1
          fi
          readelf -h "$BIN" | grep -E 'Class:|Machine:'
          mkdir -p dist
          cp "$BIN" dist/
          cp upstream-commit.txt proxmox-rs-commit.txt upstream-cargo-config-original.toml dynamic-dependencies.txt upstream/Cargo.lock dist/
          (cd dist && sha256sum proxmox-mail-forward > SHA256SUMS)
          tar -C dist -czf proxmox-mail-forward-linux-arm64.tar.gz .

      - name: Upload artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: proxmox-mail-forward-linux-arm64
          path: proxmox-mail-forward-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
